id: mtscan-local-info

info:
  name: MTScan Local Info Test Observation
  author: mtscan
  severity: info
  description: Local loopback-only marker used to validate informational observations.
  tags: mtscan,test,severity

http:
  - method: GET
    path:
      - "{{BaseURL}}/mtscan-info"
    matchers:
      - type: word
        words:
          - "MTSCAN_TEST_INFO"
