id: mtscan-local-critical

info:
  name: MTScan Local Critical Test Finding
  author: mtscan
  severity: critical
  description: Local loopback-only marker used to validate critical severity reporting.
  tags: mtscan,test,severity

http:
  - method: GET
    path:
      - "{{BaseURL}}/mtscan-critical"
    matchers:
      - type: word
        words:
          - "MTSCAN_TEST_CRITICAL"
