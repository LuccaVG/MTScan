name: Apply requested develop fixes

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/apply-develop-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0

      - name: Patch source and regression behavior
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:100]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          # 1) URL targets: keep the original URL for HTTP stages, but give Naabu a host.
          tool_runner = Path("src/tool_runner.py")
          marker = '''def build_naabu_command(\n'''
          helper = '''def naabu_target_from_scan_target(target: str) -> str:\n    """Return the host/IP portion that Naabu accepts for a validated scan target."""\n    if target.startswith(("http://", "https://")):\n        parsed = urllib.parse.urlparse(target)\n        if not parsed.hostname:\n            raise ScanInputError("URL targets must include a host.")\n        return parsed.hostname\n    return target\n\n\n'''
          replace_once(tool_runner, marker, helper + marker)
          replace_once(
              tool_runner,
              '        cmd.extend(["-host", target])\n',
              '        cmd.extend(["-host", naabu_target_from_scan_target(target)])\n',
          )

          # 2) Preserve raw scanner evidence. Only transient handoff lists are cleaned.
          old_cleanup = '''def cleanup_intermediate_outputs(output_dir: Path) -> None:\n    """Remove raw scanner artifacts after the single report has been written."""\n    candidates: List[Path] = []\n    for tool in SECURITY_TOOLS:\n        candidates.extend(_saved_output_candidates(tool, output_dir))\n    candidates.extend([output_dir / "httpx_targets.txt", output_dir / "nuclei_targets.txt"])\n\n    for path in dict.fromkeys(candidates):\n        try:\n            path.unlink(missing_ok=True)\n        except OSError:\n            continue\n'''
          new_cleanup = '''def cleanup_intermediate_outputs(output_dir: Path) -> None:\n    """Remove transient chain handoff lists while preserving raw scanner evidence."""\n    for path in (output_dir / "httpx_targets.txt", output_dir / "nuclei_targets.txt"):\n        try:\n            path.unlink(missing_ok=True)\n        except OSError:\n            continue\n'''
          replace_once(tool_runner, old_cleanup, new_cleanup)
          replace_once(
              tool_runner,
              '    cleanup_intermediate_outputs(output_dir)\n    _clear_result_output_files(results)\n    return report\n',
              '    cleanup_intermediate_outputs(output_dir)\n    return report\n',
          )

          # 3) Remove shell-based terminal clearing and bare except clauses in mtscan.py.
          mtscan = Path("mtscan.py")
          text = mtscan.read_text(encoding="utf-8")
          text = text.replace("    os.system('clear')\n", '    print("\\033[2J\\033[H", end="")\n', 1)
          text = text.replace("except:\n", "except Exception:\n")
          text = text.replace("import urllib.request\n", "import http.client\n", 1)

          old_wait = '''def wait_for_web_app(url, process, timeout=10):\n    """Wait briefly for the local app to answer before opening the browser."""\n    health_url = f"{url}/api/health"\n    deadline = time.monotonic() + timeout\n    last_error = None\n\n    while time.monotonic() < deadline:\n        return_code = process.poll()\n        if return_code is not None:\n            print(f"[APP] Web app exited before it became ready (code {return_code}).")\n            return False\n\n        try:\n            with urllib.request.urlopen(health_url, timeout=1) as response:  # nosec B310\n                if response.status == 200:\n                    return True\n        except Exception as exc:\n            last_error = exc\n            time.sleep(0.25)\n\n    if last_error:\n        print(f"[APP] Server did not answer readiness check yet: {last_error}")\n    else:\n        print("[APP] Server did not answer readiness check yet.")\n    return False\n'''
          new_wait = '''def wait_for_web_app(url, process, timeout=10):\n    """Wait briefly for the local loopback app to answer before opening the browser."""\n    parsed = urllib.parse.urlparse(url)\n    if parsed.scheme != "http" or parsed.hostname not in {"127.0.0.1", "localhost", "::1"}:\n        print("[APP] Refusing readiness check for a non-loopback HTTP URL.")\n        return False\n\n    port = parsed.port or 80\n    health_path = (parsed.path.rstrip("/") or "") + "/api/health"\n    deadline = time.monotonic() + timeout\n    last_error = None\n\n    while time.monotonic() < deadline:\n        return_code = process.poll()\n        if return_code is not None:\n            print(f"[APP] Web app exited before it became ready (code {return_code}).")\n            return False\n\n        connection = None\n        try:\n            connection = http.client.HTTPConnection(parsed.hostname, port, timeout=1)\n            connection.request("GET", health_path)\n            response = connection.getresponse()\n            response.read()\n            if response.status == 200:\n                return True\n        except (OSError, http.client.HTTPException) as exc:\n            last_error = exc\n            time.sleep(0.25)\n        finally:\n            if connection is not None:\n                connection.close()\n\n    if last_error:\n        print(f"[APP] Server did not answer readiness check yet: {last_error}")\n    else:\n        print("[APP] Server did not answer readiness check yet.")\n    return False\n'''
          if old_wait not in text:
              raise SystemExit("Expected wait_for_web_app block not found in mtscan.py")
          text = text.replace(old_wait, new_wait, 1)
          mtscan.write_text(text, encoding="utf-8")

          # 4) Centralize validated HTTPS access in setup.py. Keep Bandit's B310 suppression
          # only at the single call site after scheme/host validation.
          setup = Path("install/setup.py")
          text = setup.read_text(encoding="utf-8")
          text = text.replace("import urllib.request\n", "import urllib.parse\nimport urllib.request\n", 1)
          anchor = '''def check_internet_connectivity() -> bool:\n'''
          safe_helper = '''def safe_https_open(url: str, timeout: int, allowed_hosts: set[str]):\n    """Open an HTTPS URL only when its parsed host is explicitly allowlisted."""\n    parsed = urllib.parse.urlparse(url)\n    hostname = (parsed.hostname or "").lower()\n    if parsed.scheme != "https" or hostname not in {host.lower() for host in allowed_hosts}:\n        raise ValueError(f"Refusing unexpected URL: {url}")\n    return urllib.request.urlopen(url, timeout=timeout)  # nosec B310 -- validated HTTPS allowlist above\n\n\n'''
          if anchor not in text:
              raise SystemExit("check_internet_connectivity anchor not found in install/setup.py")
          text = text.replace(anchor, safe_helper + anchor, 1)
          text = text.replace(
              '            urllib.request.urlopen(url, timeout=10)  # nosec B310\n',
              '            with safe_https_open(url, 10, {"www.google.com", "github.com"}) as response:\n                response.read(1)\n',
              1,
          )
          text = text.replace(
              '            with urllib.request.urlopen(CASSANDRA_APT_KEY_URL, timeout=60) as response:\n',
              '            with safe_https_open(CASSANDRA_APT_KEY_URL, 60, {"downloads.apache.org"}) as response:\n',
              1,
          )
          text = text.replace("except:\n", "except Exception:\n")
          setup.write_text(text, encoding="utf-8")

          # 5) Document exactly what is retained vs. cleaned.
          usage = Path("docs/USAGE.md")
          text = usage.read_text(encoding="utf-8")
          text = text.replace(
              "Raw scanner files remain in the result\nfolder for evidence and deeper investigation.\n",
              "Raw Naabu, HTTPX, and Nuclei scanner files remain in the result\nfolder for evidence and deeper investigation. Only transient chain handoff lists\n(`httpx_targets.txt` and `nuclei_targets.txt`) are removed after report generation.\n",
              1,
          )
          usage.write_text(text, encoding="utf-8")

          # 6) Make Bandit findings visible before the job fails.
          workflow = Path(".github/workflows/code-scanning.yml")
          text = workflow.read_text(encoding="utf-8")
          old_bandit = '''      - name: Run Bandit medium-confidence scan\n        if: always()\n        run: >\n          bandit\n          -r commands install src tests mtscan.py\n          --severity-level medium\n          --confidence-level medium\n          --format json\n          --output bandit.json\n\n      - name: Upload Python security reports\n'''
          new_bandit = '''      - name: Run Bandit medium-confidence scan\n        id: bandit\n        if: always()\n        continue-on-error: true\n        run: >\n          bandit\n          -r commands install src tests mtscan.py\n          --severity-level medium\n          --confidence-level medium\n          --format json\n          --output bandit.json\n\n      - name: Show Bandit findings\n        if: always() && hashFiles('bandit.json') != ''\n        run: python -m json.tool bandit.json\n\n      - name: Upload Python security reports\n'''
          if old_bandit not in text:
              raise SystemExit("Expected Bandit block not found")
          text = text.replace(old_bandit, new_bandit, 1)
          upload_anchor = '''          if-no-files-found: ignore\n\n  dependency-review:\n'''
          fail_step = '''          if-no-files-found: ignore\n\n      - name: Fail if Bandit found issues\n        if: steps.bandit.outcome == 'failure'\n        run: |\n          echo "Bandit detected medium-or-higher security findings."\n          exit 1\n\n  dependency-review:\n'''
          if upload_anchor not in text:
              raise SystemExit("Python report upload anchor not found")
          text = text.replace(upload_anchor, fail_step, 1)
          workflow.write_text(text, encoding="utf-8")
          PY

      - name: Validate Python and regression tests
        run: |
          python3 -m py_compile mtscan.py install/setup.py src/workflow.py src/tool_runner.py src/app_server.py src/scan_storage.py
          python3 -m unittest discover -s tests

      - name: Validate Bandit medium findings
        run: |
          python3 -m pip install --quiet 'bandit[toml]'
          bandit -r commands install src tests mtscan.py --severity-level medium --confidence-level medium

      - name: Commit fixes and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/apply-develop-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix URL targets, evidence retention, and Bandit findings"
          git push origin HEAD:develop
