name: Fix hardcoded credentials

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/fix-hardcoded-credentials.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0

      - name: Replace hardcoded default password
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app_server.py')
          text = path.read_text(encoding='utf-8')
          old = 'DEFAULT_USERNAME = "admin"\nDEFAULT_PASSWORD = "admin"\n'
          new = 'DEFAULT_USERNAME = "admin"\nDEFAULT_PASSWORD = secrets.token_urlsafe(18)\n'
          if old not in text:
              raise SystemExit('expected credential constants not found')
          text = text.replace(old, new, 1)

          old = '''        record = default_auth_record()\n        try:\n            STORE.save_auth(record)  # type: ignore[attr-defined]\n'''
          new = '''        record = default_auth_record()\n        print(f"[AUTH] Initial username: {DEFAULT_USERNAME}", flush=True)\n        print(f"[AUTH] Initial one-time password: {DEFAULT_PASSWORD}", flush=True)\n        print("[AUTH] Change this password after the first login.", flush=True)\n        try:\n            STORE.save_auth(record)  # type: ignore[attr-defined]\n'''
          if old not in text:
              raise SystemExit('expected auth initialization block not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Add credential regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_auth_security.py')
          path.write_text('''import ast\nimport unittest\nfrom pathlib import Path\n\n\nclass AuthSecurityTests(unittest.TestCase):\n    def test_default_password_is_not_a_hardcoded_string(self):\n        source = Path("src/app_server.py").read_text(encoding="utf-8")\n        tree = ast.parse(source)\n        for node in tree.body:\n            if not isinstance(node, ast.Assign):\n                continue\n            names = [target.id for target in node.targets if isinstance(target, ast.Name)]\n            if "DEFAULT_PASSWORD" in names:\n                self.assertFalse(isinstance(node.value, ast.Constant) and isinstance(node.value.value, str))\n                return\n        self.fail("DEFAULT_PASSWORD assignment not found")\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY

      - name: Validate and commit
        run: |
          python -m py_compile src/app_server.py
          python -m unittest tests.test_auth_security
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app_server.py tests/test_auth_security.py
          git commit -m "Remove hardcoded default web credentials"
          git push origin HEAD:develop
