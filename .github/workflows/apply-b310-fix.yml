name: Apply Bandit B310 fix

on:
  pull_request:
    branches: [develop]
    paths:
      - .github/workflows/apply-b310-fix.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'diagnose-bandit-run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Replace urllib urlopen with HTTPSConnection
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('install/setup.py')
          text = path.read_text(encoding='utf-8')

          if 'import http.client\n' not in text:
              text = text.replace('import urllib.request\n', 'import urllib.request\nimport http.client\n', 1)

          old = '''            with urllib.request.urlopen(CASSANDRA_APT_KEY_URL, timeout=60) as response:\n                CASSANDRA_APT_KEYRING.write_bytes(response.read())\n'''
          new = '''            connection = http.client.HTTPSConnection("downloads.apache.org", timeout=60)\n            try:\n                connection.request("GET", "/cassandra/KEYS")\n                response = connection.getresponse()\n                if response.status != 200:\n                    raise OSError(f"Apache Cassandra key download failed with HTTP {response.status}")\n                CASSANDRA_APT_KEYRING.write_bytes(response.read())\n            finally:\n                connection.close()\n'''
          if old not in text:
              raise SystemExit('Expected urllib.request.urlopen block not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install/setup.py
          git commit -m "Fix Bandit B310 Cassandra key download"
          git push origin HEAD:${{ github.head_ref }}
