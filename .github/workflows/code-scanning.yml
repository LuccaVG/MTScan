name: Code Scanning

on:
  push:
  pull_request:
  schedule:
    - cron: "22 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-scanning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - javascript-typescript

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml
          build-mode: none

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          output: codeql-results
          upload: never

      - name: Upload CodeQL SARIF artifact
        uses: actions/upload-artifact@v5
        if: always() && hashFiles('codeql-results/**/*.sarif') != ''
        with:
          name: codeql-${{ matrix.language }}-sarif
          path: codeql-results/**/*.sarif
          if-no-files-found: ignore

  semgrep:
    name: Semgrep SARIF
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Semgrep
        run: python -m pip install --upgrade semgrep

      - name: Run Semgrep
        continue-on-error: true
        run: >
          semgrep scan
          --config p/default
          --config p/security-audit
          --config p/secrets
          --sarif
          --output semgrep.sarif
          --exclude data
          --exclude docs
          --exclude licenses
          --exclude results*
          --exclude output
          --exclude reports
          --exclude scan_results
          --exclude nuclei_responses
          .

      - name: Require Semgrep SARIF output
        if: always() && hashFiles('semgrep.sarif') == ''
        run: |
          echo "Semgrep did not produce semgrep.sarif"
          exit 1

      - name: Upload Semgrep SARIF artifact
        uses: actions/upload-artifact@v5
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore

  python-dependency-audit:
    name: Python Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: python -m pip install --upgrade pip-audit "bandit[toml]"

      - name: Audit Python dependencies
        run: >
          pip-audit
          --requirement config/requirements.txt
          --format json
          --output pip-audit.json

      - name: Run Bandit medium-confidence scan
        if: always()
        run: >
          bandit
          -r commands install src tests mtscan.py
          --severity-level medium
          --confidence-level medium
          --format json
          --output bandit.json

      - name: Upload Python security reports
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: python-security-reports
          path: |
            pip-audit.json
            bandit.json
          if-no-files-found: ignore

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          license-check: false
