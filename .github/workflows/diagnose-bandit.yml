name: Diagnose Bandit

on:
  push:
    branches: [develop]
    paths:
      - .github/workflows/diagnose-bandit.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run Bandit diagnostic
        run: |
          python -m pip install --upgrade "bandit[toml]"
          set +e
          bandit -r commands install src tests mtscan.py \
            --severity-level medium \
            --confidence-level medium \
            --format json \
            --output bandit-diagnostic.json
          set -e
          python -m json.tool bandit-diagnostic.json
      - name: Commit diagnostic report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bandit-diagnostic.json
          git commit -m "Add temporary Bandit diagnostic report" || exit 0
          git push origin HEAD:develop
