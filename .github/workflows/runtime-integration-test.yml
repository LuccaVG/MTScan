name: MTScan Runtime Integration Test

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  runtime-test:
    if: github.head_ref == 'runtime-integration-test'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --upgrade -r config/requirements.txt

      - name: Create isolated scanner stubs
        shell: bash
        run: |
          set -euo pipefail
          FAKE_BIN="$RUNNER_TEMP/mtscan-fake-bin"
          mkdir -p "$FAKE_BIN"
          cat > "$FAKE_BIN/scanner-stub" <<'PY'
          #!/usr/bin/env python3
          import os
          import sys

          tool = os.path.basename(sys.argv[0])
          args = sys.argv[1:]
          log_path = os.environ.get("MTSCAN_FAKE_TOOL_LOG")
          if log_path:
              with open(log_path, "a", encoding="utf-8") as handle:
                  handle.write(tool + " " + " ".join(args) + "\n")

          if any(flag in args for flag in ("-version", "--version")):
              print(f"{tool} version 0.0.0-integration-test")
              raise SystemExit(0)
          if any(flag in args for flag in ("-h", "--help")):
              print(f"{tool} ProjectDiscovery integration test stub")
              raise SystemExit(0)

          if tool == "naabu":
              print("127.0.0.1:8765")
          elif tool in {"httpx", "httpx-toolkit"}:
              print("http://127.0.0.1:8765 [200] [MTScan Integration Test]")
          elif tool == "nuclei":
              print("[mtscan-integration-test] [http] [info] http://127.0.0.1:8765")
          else:
              print(f"unexpected stub name: {tool}", file=sys.stderr)
              raise SystemExit(2)
          PY
          chmod +x "$FAKE_BIN/scanner-stub"
          for tool in naabu httpx httpx-toolkit nuclei; do
            ln -s scanner-stub "$FAKE_BIN/$tool"
          done
          echo "$FAKE_BIN" >> "$GITHUB_PATH"
          echo "MTSCAN_FAKE_TOOL_LOG=$RUNNER_TEMP/mtscan-fake-tools.log" >> "$GITHUB_ENV"
          echo "MTSCAN_STORAGE_BACKEND=file" >> "$GITHUB_ENV"

      - name: Run unit and regression tests
        run: python -m unittest discover -s tests -v

      - name: Test CLI help and URL dry-run
        shell: bash
        run: |
          set -euo pipefail
          python src/workflow.py --help > cli-help.log
          grep -q -- '--dry-run' cli-help.log
          grep -q -- '--all' cli-help.log

          python src/workflow.py --all -host https://example.com --dry-run --save-output > cli-dry-run.log
          cat cli-dry-run.log
          grep -q 'Target: https://example.com' cli-dry-run.log
          grep -Eq 'naabu.*(-host|-host )example\.com|naabu.*example\.com' cli-dry-run.log

      - name: Test CLI full chain with isolated scanner stubs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf runtime-cli-results
          python src/workflow.py \
            --all \
            -host 127.0.0.1 \
            --skip-network-check \
            --save-output \
            --output-dir runtime-cli-results \
            > cli-full-run.log 2>&1
          cat cli-full-run.log
          cat "$MTSCAN_FAKE_TOOL_LOG"
          python - <<'PY'
          from pathlib import Path
          from src import tool_runner

          out = Path("runtime-cli-results")
          assert out.is_dir(), "CLI output directory was not created"
          report = out / tool_runner.REPORT_FILENAME
          assert report.is_file(), f"Expected report missing: {report}"
          raw = [p for p in out.iterdir() if p.is_file() and p.name != tool_runner.REPORT_FILENAME]
          assert raw, "No raw scanner evidence files were retained"
          text = report.read_text(encoding="utf-8", errors="replace")
          assert "127.0.0.1" in text, "Target missing from generated report"
          print("CLI report:", report)
          print("Retained files:", [p.name for p in raw])
          PY

      - name: Test interactive CLI launcher
        shell: bash
        run: |
          set -euo pipefail
          printf '0\n' | timeout 30s python mtscan.py > launcher.log 2>&1
          cat launcher.log
          grep -q 'Multi Tool Scan - Interactive Menu' launcher.log

      - name: Test web application end-to-end
        run: |
          python - <<'PY'
          import http.client
          import json
          import os
          import re
          import subprocess
          import sys
          import time
          from pathlib import Path

          host = "127.0.0.1"
          port = 8765
          log_path = Path("webapp.log")
          log_handle = log_path.open("w", encoding="utf-8")
          env = os.environ.copy()
          process = subprocess.Popen(
              [sys.executable, "-u", "src/app_server.py", "--host", host, "--port", str(port), "--no-browser"],
              stdout=log_handle,
              stderr=subprocess.STDOUT,
              env=env,
          )

          def request(method, path, payload=None, cookie=None, host_header=None):
              headers = {}
              body = None
              if payload is not None:
                  body = json.dumps(payload)
                  headers["Content-Type"] = "application/json"
              if cookie:
                  headers["Cookie"] = cookie
              if host_header:
                  headers["Host"] = host_header
              conn = http.client.HTTPConnection(host, port, timeout=5)
              try:
                  conn.request(method, path, body=body, headers=headers)
                  resp = conn.getresponse()
                  raw = resp.read()
                  text = raw.decode("utf-8", errors="replace")
                  return resp.status, dict(resp.getheaders()), text
              finally:
                  conn.close()

          def json_request(method, path, payload=None, cookie=None):
              status, headers, text = request(method, path, payload, cookie)
              data = json.loads(text) if text else {}
              return status, headers, data

          def wait_scan(scan_id, cookie, timeout=20):
              deadline = time.time() + timeout
              while time.time() < deadline:
                  status, _, data = json_request("GET", f"/api/scans/{scan_id}", cookie=cookie)
                  assert status == 200, (status, data)
                  if data.get("status") not in {"queued", "running"}:
                      return data
                  time.sleep(0.25)
              raise AssertionError(f"scan {scan_id} did not finish")

          try:
              deadline = time.time() + 20
              while True:
                  if process.poll() is not None:
                      raise AssertionError(f"web app exited early with {process.returncode}")
                  try:
                      status, _, index = request("GET", "/")
                      if status == 200:
                          break
                  except OSError:
                      pass
                  if time.time() >= deadline:
                      raise AssertionError("web app did not become ready")
                  time.sleep(0.25)

              assert "MTScan" in index, "dashboard HTML did not load"

              status, _, session = json_request("GET", "/api/session")
              assert status == 200 and session.get("authenticated") is False, session

              status, _, denied = json_request("GET", "/api/health")
              assert status == 401 and denied.get("authenticated") is False, denied

              # The first-run credential is generated at runtime and printed only locally.
              deadline = time.time() + 5
              password = None
              while time.time() < deadline:
                  log_handle.flush()
                  log_text = log_path.read_text(encoding="utf-8", errors="replace")
                  match = re.search(r"Initial one-time password: (\S+)", log_text)
                  if match:
                      password = match.group(1)
                      break
                  time.sleep(0.1)
              assert password, "one-time password was not emitted on first startup"

              status, headers, login = json_request(
                  "POST", "/api/login", {"username": "admin", "password": password}
              )
              assert status == 200 and login.get("authenticated") is True, login
              cookie = headers.get("Set-Cookie", "").split(";", 1)[0]
              assert cookie.startswith("mtscan_session="), headers
              assert login.get("must_change_password") is True, login

              status, _, blocked = json_request("GET", "/api/health", cookie=cookie)
              assert status == 403 and blocked.get("must_change_password") is True, blocked

              new_password = "MTScan-Integration-Password-2026"
              status, _, changed = json_request(
                  "POST",
                  "/api/change-password",
                  {
                      "current_password": password,
                      "new_password": new_password,
                      "confirm_password": new_password,
                  },
                  cookie=cookie,
              )
              assert status == 200 and changed.get("must_change_password") is False, changed

              status, _, health = json_request("GET", "/api/health", cookie=cookie)
              assert status == 200, health

              forbidden_status, _, _ = request("GET", "/", host_header="evil.example")
              assert forbidden_status == 403, forbidden_status

              status, _, dry = json_request(
                  "POST",
                  "/api/scans",
                  {
                      "target": "https://example.com",
                      "mode": "chain",
                      "dry_run": True,
                      "json_output": False,
                  },
                  cookie=cookie,
              )
              assert status == 201, dry
              dry_done = wait_scan(dry["id"], cookie)
              assert dry_done.get("status") == "completed", dry_done
              assert all(item.get("success") for item in dry_done.get("results", [])), dry_done

              status, _, real = json_request(
                  "POST",
                  "/api/scans",
                  {
                      "target": "127.0.0.1",
                      "mode": "chain",
                      "dry_run": False,
                      "json_output": False,
                  },
                  cookie=cookie,
              )
              assert status == 201, real
              real_done = wait_scan(real["id"], cookie)
              assert real_done.get("status") == "completed", real_done
              results = real_done.get("results", [])
              assert len(results) == 3 and all(item.get("success") for item in results), real_done
              assert real_done.get("report_file"), real_done

              summary = {
                  "static_dashboard": "PASS",
                  "unauthenticated_session": "PASS",
                  "authentication_required": "PASS",
                  "first_run_password": "PASS",
                  "forced_password_change": "PASS",
                  "authenticated_health": "PASS",
                  "host_header_protection": "PASS",
                  "dry_run_scan": dry_done.get("status"),
                  "stubbed_full_chain_scan": real_done.get("status"),
                  "full_chain_results": [item.get("tool") for item in results],
                  "report_file": real_done.get("report_file"),
              }
              Path("webapp-test-summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")
              print(json.dumps(summary, indent=2))
          finally:
              if process.poll() is None:
                  process.terminate()
                  try:
                      process.wait(timeout=5)
                  except subprocess.TimeoutExpired:
                      process.kill()
                      process.wait(timeout=5)
              log_handle.close()
              print("--- webapp.log ---")
              print(log_path.read_text(encoding="utf-8", errors="replace"))
          PY

      - name: Upload runtime test evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: mtscan-runtime-test-evidence
          path: |
            cli-help.log
            cli-dry-run.log
            cli-full-run.log
            launcher.log
            webapp.log
            webapp-test-summary.json
            runtime-cli-results/
          if-no-files-found: ignore
